name: "example-app"
version: "0.1.0"
description: "Example App - Generated by Bobra Framework"
private: true
engines:
  node: ">=24 <25"
scripts:
  dev: "pnpm run dev:generate-configs && concurrently \"pnpm --filter @example-app/dashboard run dev:build\" \"pnpm run dev:wrangler\" -n \"app,backend\""
  dev:nofrontends: "pnpm run dev:generate-configs && pnpm run dev:wrangler"
  dev:wrangler: "pnpm exec wrangler -c router/example-app-router-worker/wrangler.jsonc -c workers/example-app-api-docs-worker/wrangler.jsonc -c workers/example-app-api-token-worker/wrangler.jsonc dev --local --persist-to=${LOCAL_WRANGLER_DIR}"
  dev:generate-configs: "bash scripts/generate-configs.sh local"
  build: "pnpm -r run build"
  install-all: "pnpm install"
  type-check: "pnpm -r run type-check"
  migrate:local:postgres: "cd shared-utils && DB_ENGINE=postgres pnpm run migrate -- --local"
  migrate:local:d1: "cd shared-utils && DB_ENGINE=d1-sqlite pnpm run migrate -- --local --wrangler-config=../workers/example-app-api-docs-worker/wrangler.jsonc --persist-to=${LOCAL_WRANGLER_DIR}"
  prod:generate-configs: "bash scripts/generate-configs.sh production"
workspaces:
  - handlers/*
  - workers/*
  - router/*
  - shared-utils
  - frontends/*
keywords:
  - bobra
  - example-app
  - cloudflare-workers
  - hono
author: Danylo Hotvianskyi
license: Apache-2.0
devDependencies:
  "@types/node": "^25.9.2"
  "tsx": "catalog:"
  "typescript": "catalog:"
  "wrangler": "catalog:"
dependencies:
  "@danylohotvianskyi/bobra-framework": "catalog:"
  "concurrently": "^9.2.0"
  "pnpm": "^10.15.1"
pnpm:
  overrides:
    esbuild: "0.28.0"
    vite: "8.0.16"
    vitest: "4.1.8"
    wrangler: "4.98.0"
    "@cloudflare/vitest-pool-workers": "0.16.13"
    zod: "4.4.3"
    jsdom: "29.1.1"
    tsx: "4.22.4"
    typescript: "6.0.3"
    valibot: "1.4.1"
    hono-openapi: "1.3.0"
    hono: "4.12.24"
    drizzle-valibot: "0.4.2"
    drizzle-kit: "0.31.10"
    drizzle-orm: "0.45.2"
    "@valibot/to-json-schema": "1.7.1"
    "@hono/valibot-validator": "0.6.1"
    "@cloudflare/workers-types": "4.20260608.1"
    # "@danylohotvianskyi/bobra-framework": "file:../framework"
